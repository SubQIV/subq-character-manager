    This work includes material from the System Reference Document 5.1
    ("SRD 5.1") by Wizards of the Coast LLC, available at
    https://www.dndbeyond.com/srd. The SRD 5.1 is licensed under the Creative
    Commons Attribution 4.0 International License, available at
    https://creativecommons.org/licenses/by/4.0/legalcode. Rules text in this
    pack is summarised.

conditions:
  - id: blinded
    name: Blinded
    summary: Can't see. Attacks against you have advantage; yours have disadvantage.
    rules:
      - You can't see, and you automatically fail any ability check that requires sight.
      - Attack rolls against you have advantage, and your attack rolls have disadvantage.

  - id: charmed
    name: Charmed
    summary: Can't attack or harm the charmer, who has advantage on social checks with you.
    rules:
      - You can't attack the charmer or target it with harmful abilities or magical effects.
      - The charmer has advantage on ability checks to interact socially with you.

  - id: deafened
    name: Deafened
    summary: Can't hear; fail checks that need hearing.
    rules:
      - You can't hear, and you automatically fail any ability check that requires hearing.

  - id: exhaustion
    name: Exhaustion
    summary: Six cumulative levels of penalties. Level 6 is death.
    rules:
      - Exhaustion has six levels. Each level's effects add to those of the levels below it.
      - Finishing a long rest reduces your exhaustion level by 1, provided you've had food and drink.
    levels:
      - level: 1
        effect: Disadvantage on ability checks.
      - level: 2
        effect: Speed halved.
      - level: 3
        effect: Disadvantage on attack rolls and saving throws.
      - level: 4
        effect: Hit point maximum halved.
      - level: 5
        effect: Speed reduced to 0.
      - level: 6
        effect: Death.

  - id: frightened
    name: Frightened
    summary: Disadvantage while you can see the source of your fear; can't move closer to it.
    rules:
      - You have disadvantage on ability checks and attack rolls while the source of your fear is within line of sight.
      - You can't willingly move closer to the source of your fear.

  - id: grappled
    name: Grappled
    summary: Speed 0 until the grapple ends.
    rules:
      - Your speed becomes 0, and you can't benefit from any bonus to your speed.
      - The condition ends if the grappler is incapacitated.
      - It also ends if an effect moves you out of the grappler's reach, such as being thrown away by the thunderwave spell.

  - id: incapacitated
    name: Incapacitated
    summary: No actions or reactions.
    rules:
      - You can't take actions or reactions.

  - id: invisible
    name: Invisible
    summary: Can't be seen without magic or a special sense. Attacks against you have disadvantage; yours have advantage.
    rules:
      - You're impossible to see without the aid of magic or a special sense. For hiding, you count as heavily obscured.
      - Your location can still be detected by any noise you make or tracks you leave.
      - Attack rolls against you have disadvantage, and your attack rolls have advantage.

  - id: paralyzed
    name: Paralyzed
    summary: Incapacitated and can't move or speak. Hits from within 5 feet are critical.
    rules:
      - You're incapacitated and can't move or speak.
      - You automatically fail Strength and Dexterity saving throws.
      - Attack rolls against you have advantage.
      - Any attack that hits you is a critical hit if the attacker is within 5 feet of you.

  - id: petrified
    name: Petrified
    summary: Turned to stone. Incapacitated, resistant to all damage.
    rules:
      - You're transformed, along with any nonmagical objects you're wearing or carrying, into a solid inanimate substance, usually stone. Your weight increases by a factor of ten, and you stop aging.
      - You're incapacitated, can't move or speak, and are unaware of your surroundings.
      - Attack rolls against you have advantage.
      - You automatically fail Strength and Dexterity saving throws.
      - You have resistance to all damage.
      - You're immune to poison and disease. Any poison or disease already affecting you is suspended, not neutralised.

  - id: poisoned
    name: Poisoned
    summary: Disadvantage on attack rolls and ability checks.
    rules:
      - You have disadvantage on attack rolls and ability checks.

  - id: prone
    name: Prone
    summary: Crawl or stand up. Disadvantage on your attacks; nearby attackers have advantage.
    rules:
      - Your only movement option is to crawl, unless you stand up, which ends the condition. Standing costs half your speed.
      - You have disadvantage on attack rolls.
      - An attack roll against you has advantage if the attacker is within 5 feet of you. Otherwise, it has disadvantage.

  - id: restrained
    name: Restrained
    summary: Speed 0. Attacks against you have advantage; yours have disadvantage.
    rules:
      - Your speed becomes 0, and you can't benefit from any bonus to your speed.
      - Attack rolls against you have advantage, and your attack rolls have disadvantage.
      - You have disadvantage on Dexterity saving throws.

  - id: stunned
    name: Stunned
    summary: Incapacitated, can't move, fail Strength and Dexterity saves.
    rules:
      - You're incapacitated, can't move, and can speak only falteringly.
      - You automatically fail Strength and Dexterity saving throws.
      - Attack rolls against you have advantage.

  - id: unconscious
    name: Unconscious
    summary: Incapacitated, prone and unaware. Hits from within 5 feet are critical.
    rules:
      - You're incapacitated, can't move or speak, and are unaware of your surroundings.
      - You drop whatever you're holding and fall prone.
      - You automatically fail Strength and Dexterity saving throws.
      - Attack rolls against you have advantage.
      - Any attack that hits you is a critical hit if the attacker is within 5 feet of you.
