pack:
  id: srd-5-2
  name: SRD 5.2 (2024 rules)
  version: 1.0.0
  edition: '2024'
  license: CC-BY-4.0
  attribution: >-
    This work includes material from the System Reference Document 5.2
    ("SRD 5.2") by Wizards of the Coast LLC, available at
    https://www.dndbeyond.com/srd. The SRD 5.2 is licensed under the Creative
    Commons Attribution 4.0 International License, available at
    https://creativecommons.org/licenses/by/4.0/legalcode. Rules text in this
    pack is summarised.

conditions:
  - id: blinded
    name: Blinded
    summary: Can't see. Attacks against you have advantage; yours have disadvantage.
    rules:
      - You can't see, and you automatically fail any ability check that requires sight.
      - Attack rolls against you have advantage, and your attack rolls have disadvantage.

  - id: charmed
    name: Charmed
    summary: Can't attack or harm the charmer, who has advantage on social checks with you.
    rules:
      - You can't attack the charmer or target it with damaging abilities or magical effects.
      - The charmer has advantage on any ability check to interact with you socially.

  - id: deafened
    name: Deafened
    summary: Can't hear; fail checks that need hearing.
    rules:
      - You can't hear, and you automatically fail any ability check that requires hearing.

  - id: exhaustion
    name: Exhaustion
    summary: Each level reduces D20 Tests by 2 and Speed by 5 feet. Level 6 is death.
    rules:
      - Exhaustion is cumulative. Each time you gain it, your level goes up by 1. You die if your level reaches 6.
      - "D20 Tests: when you make a D20 Test, the roll is reduced by 2 times your exhaustion level."
      - "Speed: your Speed is reduced by a number of feet equal to 5 times your exhaustion level."
      - Finishing a long rest removes 1 level. The condition ends when your level reaches 0.
    levels:
      - level: 1
        effect: D20 Tests −2, Speed −5 feet.
      - level: 2
        effect: D20 Tests −4, Speed −10 feet.
      - level: 3
        effect: D20 Tests −6, Speed −15 feet.
      - level: 4
        effect: D20 Tests −8, Speed −20 feet.
      - level: 5
        effect: D20 Tests −10, Speed −25 feet.
      - level: 6
        effect: Death.

  - id: frightened
    name: Frightened
    summary: Disadvantage while you can see the source of your fear; can't move closer to it.
    rules:
      - You have disadvantage on ability checks and attack rolls while the source of your fear is within line of sight.
      - You can't willingly move closer to the source of your fear.

  - id: grappled
    name: Grappled
    summary: Speed 0, and disadvantage attacking anyone but the grappler.
    rules:
      - Your Speed is 0 and can't increase.
      - You have disadvantage on attack rolls against any target other than the grappler.
      - The grappler can drag or carry you when it moves, but every foot of movement costs it 1 extra foot unless you are Tiny or two or more sizes smaller than it.

  - id: incapacitated
    name: Incapacitated
    summary: No actions, bonus actions or reactions; can't speak; concentration ends.
    rules:
      - You can't take any action, Bonus Action, or Reaction.
      - Your concentration is broken.
      - You can't speak.
      - If you're incapacitated when you roll initiative, you have disadvantage on the roll.

  - id: invisible
    name: Invisible
    summary: Concealed. Attacks against you have disadvantage; yours have advantage.
    rules:
      - "Surprise: if you're invisible when you roll initiative, you have advantage on the roll."
      - "Concealed: you aren't affected by any effect that requires its target to be seen, unless the effect's creator can somehow see you. Any equipment you are wearing or carrying is also concealed."
      - "Attacks affected: attack rolls against you have disadvantage, and your attack rolls have advantage. If a creature can somehow see you, you don't gain this benefit against it."

  - id: paralyzed
    name: Paralyzed
    summary: Incapacitated, Speed 0. Hits from within 5 feet are critical.
    rules:
      - You have the Incapacitated condition.
      - Your Speed is 0 and can't increase.
      - You automatically fail Strength and Dexterity saving throws.
      - Attack rolls against you have advantage.
      - Any attack roll that hits you is a critical hit if the attacker is within 5 feet of you.

  - id: petrified
    name: Petrified
    summary: Turned to stone. Incapacitated, resistant to all damage.
    rules:
      - You're transformed, along with any nonmagical objects you're wearing and carrying, into a solid inanimate substance, usually stone. Your weight increases by a factor of ten, and you stop aging.
      - You have the Incapacitated condition.
      - Your Speed is 0 and can't increase.
      - Attack rolls against you have advantage.
      - You automatically fail Strength and Dexterity saving throws.
      - You have resistance to all damage.
      - You have immunity to the Poisoned condition.

  - id: poisoned
    name: Poisoned
    summary: Disadvantage on attack rolls and ability checks.
    rules:
      - You have disadvantage on attack rolls and ability checks.

  - id: prone
    name: Prone
    summary: Crawl or stand up. Disadvantage on your attacks; nearby attackers have advantage.
    rules:
      - Your only movement options are to crawl or to spend movement equal to half your Speed (round down) to stand up, which ends the condition. If your Speed is 0, you can't stand up.
      - You have disadvantage on attack rolls.
      - An attack roll against you has advantage if the attacker is within 5 feet of you. Otherwise, it has disadvantage.

  - id: restrained
    name: Restrained
    summary: Speed 0. Attacks against you have advantage; yours have disadvantage.
    rules:
      - Your Speed is 0 and can't increase.
      - Attack rolls against you have advantage, and your attack rolls have disadvantage.
      - You have disadvantage on Dexterity saving throws.

  - id: stunned
    name: Stunned
    summary: Incapacitated; fail Strength and Dexterity saves.
    rules:
      - You have the Incapacitated condition.
      - You automatically fail Strength and Dexterity saving throws.
      - Attack rolls against you have advantage.

  - id: unconscious
    name: Unconscious
    summary: Incapacitated, prone and unaware. Hits from within 5 feet are critical.
    rules:
      - You have the Incapacitated and Prone conditions, and you drop whatever you're holding. When this condition ends, you remain Prone.
      - Your Speed is 0 and can't increase.
      - Attack rolls against you have advantage.
      - You automatically fail Strength and Dexterity saving throws.
      - Any attack roll that hits you is a critical hit if the attacker is within 5 feet of you.
      - You're unaware of your surroundings.
